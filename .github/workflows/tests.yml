name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The losslessness suite is the one that must never silently regress:
      # a break there still emits plausible text, so only the tests catch it.
      - name: Losslessness (fast lane)
        run: pytest tests/test_lossless.py tests/test_math.py -q

      - name: Full suite
        run: pytest -q --durations=5

  bench:
    # Cheap smoke test that the experiments still run; not a perf measurement.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - run: python -m draftkv.bench regimes
      - run: python -m draftkv.bench gamma
